<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
</head>
<style>
    body{
        height: 98vh; /* 100% da altura da tela */
        border: 2px solid black;
        background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');
        background-size: 100px; /* Tamanho da imagem de fundo, se forem iguais precisa somente 1 100px*/
        background-repeat: no-repeat; /* Repeat Repetição da imagem de fundo, no-repeat não repete, repeat-x repete horizontalmente, repeat-y repete verticalmente */
        background-position: right center; /* Posição da imagem de fundo, left top, left center, left bottom, center top, center center, center bottom, right top, right center, right bottom */
    }
</style>
<body>
    
</body>
</html>
